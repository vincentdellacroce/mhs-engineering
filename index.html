<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bruin Coffee | Artisanal Fluid Experience</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Plus+Jakarta+Sans:wght@300;500&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <style>
    :root {
      --color-espresso: #120a06;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--color-espresso);
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
  </style>
</head>
<body class="relative select-none text-white overflow-hidden w-full h-full">

  <canvas id="webgl-canvas" class="absolute inset-0 w-full h-full z-0 block pointer-events-auto touch-none"></canvas>

  <svg class="pointer-events-none fixed inset-0 w-full h-full z-50 opacity-[0.025] mix-blend-overlay">
    <filter id="noiseFilter">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" stitchTiles="stitch" />
    </filter>
    <rect width="100%" height="100%" filter="url(#noiseFilter)" />
  </svg>

  <main class="absolute inset-0 z-10 flex flex-col justify-between p-8 md:p-16 xl:p-24 pointer-events-none mix-blend-difference">
    <header class="w-full flex justify-between items-start">
      <div class="flex flex-col gap-1">
        <span class="text-xs tracking-[0.3em] uppercase font-semibold text-neutral-400">Concept No. 04</span>
        <span class="text-sm font-light text-neutral-200">Bruin Atelier</span>
      </div>
      <nav class="hidden md:flex gap-12 text-sm font-medium tracking-widest uppercase text-neutral-300">
        <span>Origin</span>
        <span>The Roasts</span>
        <span>Experience</span>
      </nav>
      <button class="pointer-events-auto border border-white/20 px-5 py-2 text-xs tracking-widest uppercase rounded-full bg-white/5 backdrop-blur-md hover:bg-white hover:text-black transition-all duration-500 ease-out">
        Reserve
      </button>
    </header>

    <section class="w-full flex flex-col items-center justify-center flex-grow py-32">
      <div class="text-center opacity-0 pointer-events-none">
        <h1 class="text-[clamp(2.8rem,9vw,11rem)]">Bruin Coffee</h1>
      </div>
    </section>

    <footer class="w-full grid grid-cols-2 md:grid-cols-3 items-end text-neutral-400 text-xs tracking-wider">
      <div class="flex flex-col gap-2">
        <span class="font-mono text-[10px] text-neutral-500">// ADVECTION PIPELINE ACTIVE</span>
        <span id="fps-display" class="font-mono">Initializing Engine...</span>
      </div>
      <div class="hidden md:block text-center italic font-['Playfair_Display'] text-neutral-300 text-base">
        "Refinement through physics."
      </div>
      <div class="text-right flex flex-col gap-1 items-end">
        <span class="uppercase tracking-[0.2em] font-semibold text-neutral-200">Interact</span>
        <span class="text-[11px] text-neutral-500">Drag or click to marble cream natively</span>
      </div>
    </footer>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    const vertexShaderSource = `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = vec4(position, 1.0);
      }
    `;

    const simulationFragmentShaderSource = `
      uniform vec2 u_resolution;
      uniform sampler2D u_buffer;
      uniform vec2 u_mouse;
      uniform vec2 u_move_dir;
      uniform float u_mouse_force;
      uniform float u_is_clicking;
      varying vec2 vUv;

      void main() {
        vec2 uv = vUv;
        vec2 texel = vec2(1.0) / u_resolution;

        // Channel Maps: [r] Height Map Ripples, [g] Cream Density, [ba] Velocity Vectors
        vec4 data = texture2D(u_buffer, uv);
        float height = data.r;
        vec2 vel     = data.ba;

        // 1. FLUID ADVECTION STEP (Look back along velocity paths)
        vec2 backUv = uv - vel * 0.004;
        vec4 advectedData = texture2D(u_buffer, backUv);
        
        float nextHeight = advectedData.r;
        float nextCream  = advectedData.g;
        vec2 nextVel     = advectedData.ba;

        // 2. CONSERVATION DIFFUSION PASS (Smooth fluid stepping breaks)
        vec4 dataL = texture2D(u_buffer, uv + vec2(-texel.x, 0.0));
        vec4 dataR = texture2D(u_buffer, uv + vec2(texel.x, 0.0));
        vec4 dataT = texture2D(u_buffer, uv + vec2(0.0, texel.y));
        vec4 dataB = texture2D(u_buffer, uv + vec2(0.0, -texel.y));

        vec2 diffusedVel   = (dataL.ba + dataR.ba + dataT.ba + dataB.ba) * 0.25;
        float diffusedCream = (dataL.g + dataR.g + dataT.g + dataB.g) * 0.25;
        float diffusedHeight= (dataL.r + dataR.r + dataT.r + dataB.r) * 0.25;

        nextVel   = mix(nextVel, diffusedVel, 0.12);
        nextCream = mix(nextCream, diffusedCream, 0.015);
        nextHeight = mix(nextHeight, diffusedHeight, 0.05) + (diffusedHeight - height) * 0.15;

        // Damping coefficients for viscous flow preservation
        nextVel *= 0.982;
        nextCream *= 0.9998; // Cream stays permanently anchored to the composition

        // 3. INTERACTIVE MOUSE MOMENTUM & CREAM IMPULSE
        if (u_mouse_force > 0.0) {
          float dist = distance(uv, u_mouse);
          float radius = mix(0.035, 0.055, u_is_clicking);
          float influence = smoothstep(radius, 0.0, dist);

          if (influence > 0.0) {
            // Add vector directional forces directly into momentum buffers
            nextVel += u_move_dir * u_mouse_force * influence * 0.35;
            
            // Pour white cream matrix mass
            float creamMass = mix(0.25, 0.95, u_is_clicking);
            nextCream += influence * u_mouse_force * creamMass;
            
            // Displace surface height geometry
            nextHeight += influence * u_mouse_force * 0.35;
          }
        }

        gl_FragColor = vec4(
          clamp(nextHeight, -2.0, 2.0),
          clamp(nextCream, 0.0, 5.0),
          clamp(nextVel.x, -2.0, 2.0),
          clamp(nextVel.y, -2.0, 2.0)
        );
      }
    `;

    const renderFragmentShaderSource = `
      uniform vec2 u_resolution;
      uniform sampler2D u_buffer;
      uniform sampler2D u_text_texture;
      varying vec2 vUv;

      void main() {
        vec2 uv = vUv;
        vec2 texel = vec2(1.0) / u_resolution;

        vec4 simData = texture2D(u_buffer, uv);
        float height = simData.r;
        float creamDensity = simData.g;

        // Reconstruct spatial normal offsets for accurate specular fluid reflections
        float hl = texture2D(u_buffer, uv + vec2(-texel.x, 0.0)).r;
        float hr = texture2D(u_buffer, uv + vec2(texel.x, 0.0)).r;
        float ht = texture2D(u_buffer, uv + vec2(0.0, texel.y)).r;
        float hb = texture2D(u_buffer, uv + vec2(0.0, -texel.y)).r;
        vec3 normal = normalize(vec3((hl - hr) * 5.5, (hb - ht) * 5.5, 1.0));

        // LUXURY ORGANIC COFFEE TONAL SPECTRUM MAPS
        vec3 espressoBg     = vec3(0.035, 0.016, 0.005); // Core deep black espresso
        vec3 espressoRoast  = vec3(0.125, 0.068, 0.032); // Beautiful dark roast liquid variations
        vec3 latteVelvet    = vec3(0.485, 0.325, 0.195); // Smoothly blended middle cream texture
        vec3 artisanalCream = vec3(0.975, 0.945, 0.905); // High density opaque creamer state

        // Typographic layout refraction maps
        vec2 distortion = normal.xy * 0.032;
        float textSample = texture2D(u_text_texture, uv + distortion).r;

        vec3 liquidBase = mix(espressoBg, espressoRoast, clamp(height * 0.5 + 0.5, 0.0, 1.0));

        // High contrast chromatic density blending loops
        vec3 colorMixed;
        if (creamDensity < 0.28) {
          colorMixed = mix(liquidBase, latteVelvet, creamDensity / 0.28);
        } else {
          colorMixed = mix(latteVelvet, artisanalCream, clamp((creamDensity - 0.28) / 1.35, 0.0, 1.0));
        }

        // Composite typography layer
        vec3 textToneColor = vec3(0.98, 0.96, 0.93);
        vec3 finalColor = mix(colorMixed, textToneColor, textSample * 0.92);

        // Advanced Fresnel specular highlighting calculations
        vec3 lightDir = normalize(vec3(0.25, 0.55, 0.75));
        vec3 viewDir  = vec3(0.0, 0.0, 1.0);
        vec3 halfDir  = normalize(lightDir + viewDir);
        float spec = pow(max(dot(normal, halfDir), 0.0), 75.0);
        
        // Boost surface glass reflections on cream boundaries
        float gloss = mix(0.45, 1.35, smoothstep(0.1, 0.9, creamDensity));
        vec3 specular = vec3(0.99, 0.96, 0.91) * spec * gloss;

        gl_FragColor = vec4(finalColor + specular, 1.0);
      }
    `;

    class FluidSimulationEngine {
      constructor() {
        this.canvas = document.getElementById('webgl-canvas');
        this.fpsDisplay = document.getElementById('fps-display');
        
        this.mouse = { x: 0.5, y: 0.5, prevX: 0.5, prevY: 0.5, targetX: 0.5, targetY: 0.5 };
        this.isClicking = 0.0;
        this.hasMoved = false;
        
        this.lastTime = performance.now();
        this.frameCount = 0;

        this.createTextTexture();
        this.initEngine();
      }

      createTextTexture() {
        this.textCanvas = document.createElement('canvas');
        this.textCtx = this.textCanvas.getContext('2d');
        this.textTexture = new THREE.CanvasTexture(this.textCanvas);
        this.textTexture.minFilter = THREE.LinearFilter;
        this.textTexture.magFilter = THREE.LinearFilter;
        this.updateTextCanvasSize();
      }

      updateTextCanvasSize() {
        const ratio = Math.min(window.devicePixelRatio, 2);
        this.textCanvas.width = window.innerWidth * ratio;
        this.textCanvas.height = window.innerHeight * ratio;

        const ctx = this.textCtx;
        ctx.clearRect(0, 0, this.textCanvas.width, this.textCanvas.height);
        
        const baseSize = window.innerWidth;
        let fontSize = baseSize * 0.09; 
        if (fontSize < 46) fontSize = 46;
        if (fontSize > 165) fontSize = 165;
        fontSize = fontSize * ratio;

        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, this.textCanvas.width, this.textCanvas.height);

        ctx.font = `400 ${fontSize}px 'Playfair Display', serif`;
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.letterSpacing = "-0.02em";
        
        ctx.fillText("Bruin Coffee", this.textCanvas.width / 2, this.textCanvas.height / 2);

        if (this.textTexture) {
          this.textTexture.needsUpdate = true;
        }
      }

      initEngine() {
        this.scene = new THREE.Scene();
        this.camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        
        this.renderer = new THREE.WebGLRenderer({
          canvas: this.canvas,
          antialias: false,
          powerPreference: "high-performance"
        });
        
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        const ratio = Math.min(window.devicePixelRatio, 2);
        this.renderer.setPixelRatio(ratio);

        this.width = Math.floor(window.innerWidth * ratio);
        this.height = Math.floor(window.innerHeight * ratio);

        const gl = this.renderer.getContext();
        let textureType = THREE.FloatType;
        if (!gl.getExtension('OES_texture_float') || !gl.getExtension('OES_texture_float_linear')) {
          textureType = THREE.HalfFloatType;
        }

        const targetOptions = {
          minFilter: THREE.LinearFilter,
          magFilter: THREE.LinearFilter,
          format: THREE.RGBAFormat,
          type: textureType,
          depthBuffer: false,
          stencilBuffer: false,
        };

        // Complete 2-Buffer Ping-Pong Vector Arrays Architecture
        this.bufferA = new THREE.WebGLRenderTarget(this.width, this.height, targetOptions);
        this.bufferB = new THREE.WebGLRenderTarget(this.width, this.height, targetOptions);

        this.simulationMaterial = new THREE.ShaderMaterial({
          vertexShader: vertexShaderSource,
          fragmentShader: simulationFragmentShaderSource,
          uniforms: {
            u_resolution: { value: new THREE.Vector2(this.width, this.height) },
            u_buffer: { value: null },
            u_mouse: { value: new THREE.Vector2(0.5, 0.5) },
            u_move_dir: { value: new THREE.Vector2(0.0, 0.0) },
            u_mouse_force: { value: 0.0 },
            u_is_clicking: { value: 0.0 }
          }
        });

        this.renderMaterial = new THREE.ShaderMaterial({
          vertexShader: vertexShaderSource,
          fragmentShader: renderFragmentShaderSource,
          uniforms: {
            u_resolution: { value: new THREE.Vector2(this.width, this.height) },
            u_buffer: { value: null },
            u_text_texture: { value: this.textTexture }
          }
        });

        this.geometry = new THREE.PlaneGeometry(2, 2);
        this.mesh = new THREE.Mesh(this.geometry, this.simulationMaterial);
        this.scene.add(this.mesh);

        this.setupEventListeners();
        this.tick();
      }

      setupEventListeners() {
        const updateCoords = (x, y) => {
          this.mouse.targetX = x / window.innerWidth;
          this.mouse.targetY = 1.0 - (y / window.innerHeight);
          
          if (!this.hasMoved) {
            this.mouse.x = this.mouse.targetX;
            this.mouse.y = this.mouse.targetY;
            this.mouse.prevX = this.mouse.targetX;
            this.mouse.prevY = this.mouse.targetY;
            this.hasMoved = true;
          }
        };

        window.addEventListener('mousemove', (e) => updateCoords(e.clientX, e.clientY));
        window.addEventListener('touchmove', (e) => {
          if (e.touches.length > 0) updateCoords(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true });

        window.addEventListener('mousedown', () => { this.isClicking = 1.0; });
        window.addEventListener('mouseup', () => { this.isClicking = 0.0; });
        
        window.addEventListener('touchstart', (e) => {
          if (e.touches.length > 0) updateCoords(e.touches[0].clientX, e.touches[0].clientY);
          this.isClicking = 1.0;
        }, { passive: true });
        window.addEventListener('touchend', () => { this.isClicking = 0.0; });

        window.addEventListener('resize', () => {
          const r = Math.min(window.devicePixelRatio, 2);
          this.updateTextCanvasSize();
          this.renderer.setSize(window.innerWidth, window.innerHeight);
          this.width = Math.floor(window.innerWidth * r);
          this.height = Math.floor(window.innerHeight * r);

          this.bufferA.setSize(this.width, this.height);
          this.bufferB.setSize(this.width, this.height);

          this.simulationMaterial.uniforms.u_resolution.value.set(this.width, this.height);
          this.renderMaterial.uniforms.u_resolution.value.set(this.width, this.height);
        });
      }

      tick() {
        requestAnimationFrame(() => this.tick());

        this.frameCount++;
        const now = performance.now();
        if (now >= this.lastTime + 1000) {
          this.fpsDisplay.innerText = `${((this.frameCount * 1000) / (now - this.lastTime)).toFixed(1)} FPS // OPERATIONAL`;
          this.frameCount = 0;
          this.lastTime = now;
        }

        // Smoothly interpolate positions to clean dragging metrics
        this.mouse.x += (this.mouse.targetX - this.mouse.x) * 0.16;
        this.mouse.y += (this.mouse.targetY - this.mouse.y) * 0.16;

        const dx = this.mouse.x - this.mouse.prevX;
        const dy = this.mouse.y - this.mouse.prevY;
        const distanceMoved = Math.sqrt(dx * dx + dy * dy);

        let force = 0.0;
        let dirX = 0.0;
        let dirY = 0.0;

        if (distanceMoved > 0.0001) {
          force = Math.min(distanceMoved * 18.0, 2.5);
          dirX = dx / distanceMoved;
          dirY = dy / distanceMoved;
        } else if (this.isClicking > 0.5) {
          // Continuous injection drop force on a static click
          force = 0.6;
        }

        // Execution step 1: Compute simulation physics frame pass
        this.mesh.material = this.simulationMaterial;
        this.simulationMaterial.uniforms.u_mouse.value.set(this.mouse.x, this.mouse.y);
        this.simulationMaterial.uniforms.u_move_dir.value.set(dirX, dirY);
        this.simulationMaterial.uniforms.u_mouse_force.value = force;
        this.simulationMaterial.uniforms.u_is_clicking.value = this.isClicking;
        this.simulationMaterial.uniforms.u_buffer.value = this.bufferA.texture;

        this.renderer.setRenderTarget(this.bufferB);
        this.renderer.render(this.scene, this.camera);

        // Ping-pong buffer swap loop
        const temp = this.bufferA;
        this.bufferA = this.bufferB;
        this.bufferB = temp;

        // Execution step 2: Compile rendering chromatic pipeline pass to monitor screen
        this.mesh.material = this.renderMaterial;
        this.renderMaterial.uniforms.u_buffer.value = this.bufferA.texture;
        
        this.renderer.setRenderTarget(null);
        this.renderer.render(this.scene, this.camera);

        this.mouse.prevX = this.mouse.x;
        this.mouse.prevY = this.mouse.y;
      }
    }

    window.addEventListener('load', () => {
      setTimeout(() => {
        new FluidSimulationEngine();
      }, 200);
    });
  </script>
</body>
</html>
