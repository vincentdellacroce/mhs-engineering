<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bruin Coffee | Artisanal Fluid Experience</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Plus+Jakarta+Sans:wght@300;500&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <style>
    :root {
      --color-espresso: #120a06;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--color-espresso);
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
  </style>
</head>
<body class="relative select-none text-white overflow-hidden w-full h-full">

  <canvas id="webgl-canvas" class="absolute inset-0 w-full h-full z-0 block pointer-events-auto touch-none"></canvas>

  <svg class="pointer-events-none fixed inset-0 w-full h-full z-50 opacity-[0.025] mix-blend-overlay">
    <filter id="noiseFilter">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" stitchTiles="stitch" />
    </filter>
    <rect width="100%" height="100%" filter="url(#noiseFilter)" />
  </svg>

  <main class="absolute inset-0 z-10 flex flex-col justify-between p-8 md:p-16 xl:p-24 pointer-events-none mix-blend-difference">
    <header class="w-full flex justify-between items-start">
      <div class="flex flex-col gap-1">
        <span class="text-xs tracking-[0.3em] uppercase font-semibold text-neutral-400">Concept No. 04</span>
        <span class="text-sm font-light text-neutral-200">Bruin Atelier</span>
      </div>
      <nav class="hidden md:flex gap-12 text-sm font-medium tracking-widest uppercase text-neutral-300">
        <span>Origin</span>
        <span>The Roasts</span>
        <span>Experience</span>
      </nav>
      <button class="pointer-events-auto border border-white/20 px-5 py-2 text-xs tracking-widest uppercase rounded-full bg-white/5 backdrop-blur-md hover:bg-white hover:text-black transition-all duration-500 ease-out">
        Reserve
      </button>
    </header>

    <section class="w-full flex flex-col items-center justify-center flex-grow py-32">
      <div class="text-center opacity-0 pointer-events-none">
        <h1 class="text-[clamp(2.8rem,9vw,11rem)]">Bruin Coffee</h1>
      </div>
    </section>

    <footer class="w-full grid grid-cols-2 md:grid-cols-3 items-end text-neutral-400 text-xs tracking-wider">
      <div class="flex flex-col gap-2">
        <span class="font-mono text-[10px] text-neutral-500">// INTEGRATED FLUID PIPELINE</span>
        <span id="fps-display" class="font-mono">Initializing Engine...</span>
      </div>
      <div class="hidden md:block text-center italic font-['Playfair_Display'] text-neutral-300 text-base">
        "Refinement through physics."
      </div>
      <div class="text-right flex flex-col gap-1 items-end">
        <span class="uppercase tracking-[0.2em] font-semibold text-neutral-200">Interact</span>
        <span class="text-[11px] text-neutral-500">Drag or click to pour dynamic cream</span>
      </div>
    </footer>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    const vertexShaderSource = `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = vec4(position, 1.0);
      }
    `;

    const simulationFragmentShaderSource = `
      uniform vec2 u_resolution;
      uniform float u_mouse_force;
      uniform vec2 u_mouse_pos; 
      uniform vec2 u_mouse_pos_old; 
      uniform vec2 u_mouse_dir; 
      
      uniform vec2 u_splash_pos;
      uniform float u_splash_force;
      
      uniform sampler2D u_current_frame;
      uniform sampler2D u_prev_frame;
      varying vec2 vUv;

      void main() {
        vec2 uv = vUv;
        vec2 texel = vec2(1.0) / u_resolution;

        // DATA MATRIX ARCHITECTURE:
        // Red Channel [r]   = Wave Equation Displacement (Surface Riggles)
        // Green Channel [g] = Cream Density Concentration Matrix (0.0 to 5.0)
        // Blue Channel [b]  = Fluid Velocity Momentum X-Axis
        // Alpha Channel [a] = Fluid Velocity Momentum Y-Axis
        vec4 currentData = texture2D(u_current_frame, uv);
        float currentHeight = currentData.r;
        vec2 currentVel     = currentData.ba;

        // 1. ADVECT PERSISTENT FLUID VELOCITY VECTOR MAP (Self-Advection)
        vec2 advectedVel = texture2D(u_current_frame, uv - currentVel * 0.4 * texel).ba;
        
        // Soft velocity spatial diffusion pass to eliminate blocky stepping artifacts
        vec2 velL = texture2D(u_current_frame, uv + vec2(-texel.x, 0.0)).ba;
        vec2 velR = texture2D(u_current_frame, uv + vec2(texel.x, 0.0)).ba;
        vec2 velT = texture2D(u_current_frame, uv + vec2(0.0, texel.y)).ba;
        vec2 velB = texture2D(u_current_frame, uv + vec2(0.0, -texel.y)).ba;
        vec2 diffusedVel = (velL + velR + velT + velB) * 0.25;
        
        vec2 nextVel = mix(advectedVel, diffusedVel, 0.08);
        nextVel *= 0.985; // Viscous friction decay prevents infinite acceleration loops

        // 2. DISPLACEMENT WAVE GEOMETRY CALCULATIONS (Surface Reflection Engine)
        float left  = texture2D(u_current_frame, uv + vec2(-texel.x, 0.0)).r;
        float right = texture2D(u_current_frame, uv + vec2(texel.x, 0.0)).r;
        float top   = texture2D(u_current_frame, uv + vec2(0.0, texel.y)).r;
        float bottom= texture2D(u_current_frame, uv + vec2(0.0, -texel.y)).r;

        float prevHeight = texture2D(u_prev_frame, uv).r;
        float nextHeight = (left + right + top + bottom) * 0.5 - prevHeight;
        nextHeight *= 0.94; 

        vec2 pixelPos = uv * u_resolution;
        float creamInjection = 0.0;

        // 3. TRANSFER CONTINUOUS MOUSE DRAG FORCE FIELDS & CONTINUOUS CREAM INJECTION
        if (u_mouse_force > 0.0) {
          vec2 pA = u_mouse_pos_old * u_resolution;
          vec2 pB = u_mouse_pos * u_resolution;
          
          vec2 v = pB - pA;
          vec2 w = pixelPos - pA;
          
          float lenSq = dot(v, v);
          float t = lenSq > 0.0 ? clamp(dot(w, v) / lenSq, 0.0, 1.0) : 0.0;
          
          vec2 projection = pA + t * v;
          float dist = distance(pixelPos, projection);
          
          float wakeRadius = mix(45.0, 25.0, t); 
          float crossFade = smoothstep(wakeRadius, 0.0, dist);
          
          if (crossFade > 0.0) {
            float dragShear = dot(normalize(u_mouse_dir + vec2(0.0001)), normalize(pixelPos - pA + vec2(0.0001)));
            nextHeight += crossFade * u_mouse_force * (0.4 + 0.5 * dragShear);
            
            // Stirring action: Transfer precise dragging vectors right into the persistent velocity map
            nextVel += normalize(u_mouse_dir + vec2(0.0001)) * crossFade * u_mouse_force * 4.5;
            
            // Continuous pour: Inject pure white cream density along the mouse movement path
            creamInjection += crossFade * u_mouse_force * 0.5;
          }
        }

        // 4. DISCRETE SOLID CREAM DROP IMPULSE INJECTION (On Click or Splash Trigger)
        if (u_splash_force > 0.0) {
          vec2 targetSplashPixel = u_splash_pos * u_resolution;
          float distToSplash = distance(pixelPos, targetSplashPixel);
          
          float splashRadius = 75.0; 
          if (distToSplash < splashRadius) {
            float normalizedDist = distToSplash / splashRadius;
            
            // Sharp fluid ripple displacement spike
            float heightProfile = cos(normalizedDist * 3.14159265 * 2.0) * (1.0 - normalizedDist);
            nextHeight += heightProfile * u_splash_force * 5.0;
            
            // Radial velocity splash burst outwards from core drop center
            vec2 radialVector = normalize(pixelPos - targetSplashPixel + vec2(0.0001));
            nextVel += radialVector * (1.0 - normalizedDist) * u_splash_force * 3.5;
            
            // Inject structural, solid white cream mass footprint
            float creamProfile = smoothstep(1.0, 0.0, normalizedDist);
            creamProfile += pow(smoothstep(0.5, 0.0, normalizedDist), 2.5) * 4.0; // Multi-layered dense nucleus
            creamInjection += creamProfile * u_splash_force * 4.5;
          }
        }

        // 5. ADVECT CREAM DENSITY MATRIX OVER THE HIGH-FIDELITY FLUID MATRIX
        float advectedCream = texture2D(u_current_frame, uv - nextVel * texel * 0.6).g;
        
        // Minor conservation diffusion to preserve fine silk lines without jagged pixel breaks
        float cL = texture2D(u_current_frame, uv + vec2(-texel.x, 0.0)).g;
        float cR = texture2D(u_current_frame, uv + vec2(texel.x, 0.0)).g;
        float cT = texture2D(u_current_frame, uv + vec2(0.0, texel.y)).g;
        float cB = texture2D(u_current_frame, uv + vec2(0.0, -texel.y)).g;
        float diffusedCream = (cL + cR + cT + cB) * 0.25;

        // Compute new final cream layer state
        float nextCream = mix(advectedCream, diffusedCream, 0.012);
        nextCream += creamInjection; // Explicitly mount the new physical inputs into the buffer
        
        // MARBLING RETENTION AND GRADUAL DISSOLUTION DAMPING
        // Highly persistent constant keeps the cream visible while slowly merging with the dark roast
        nextCream *= 0.9994; 

        gl_FragColor = vec4(clamp(nextHeight, -5.0, 5.0), clamp(nextCream, 0.0, 6.0), nextVel.x, nextVel.y);
      }
    `;

    const renderFragmentShaderSource = `
      uniform vec2 u_resolution;
      uniform sampler2D u_buffer;
      uniform sampler2D u_text_texture;
      varying vec2 vUv;

      void main() {
        vec2 uv = vUv;
        vec2 texel = vec2(1.0) / u_resolution;

        vec4 simData = texture2D(u_buffer, uv);
        float height = simData.r;
        float creamDensity = simData.g;

        // Reconstruct fine physical surface normal arrays for real liquid specularity
        float hl = texture2D(u_buffer, uv + vec2(-texel.x, 0.0)).r;
        float hr = texture2D(u_buffer, uv + vec2(texel.x, 0.0)).r;
        float ht = texture2D(u_buffer, uv + vec2(0.0, texel.y)).r;
        float hb = texture2D(u_buffer, uv + vec2(0.0, -texel.y)).r;
        vec3 normal = normalize(vec3((hl - hr) * 4.5, (hb - ht) * 4.5, 1.0));

        // CHROMATIC SPECTRUM MAPS (Deep Organic Coffee & Cream Profiles)
        vec3 baseEspresso  = vec3(0.035, 0.015, 0.005);
        vec3 darkRoast     = vec3(0.125, 0.068, 0.032);
        vec3 richMacchiato = vec3(0.48, 0.32, 0.18);   // Softly dissolved light brown velvet state
        vec3 artisanCream  = vec3(0.98, 0.96, 0.92);   // Brilliant pure opaque creamer state

        vec2 distortion = normal.xy * 0.035;

        // Optical typography layer refraction mappings
        float textR = texture2D(u_text_texture, uv + distortion * 1.06).r;
        float textG = texture2D(u_text_texture, uv + distortion * 1.00).r;
        float textB = texture2D(u_text_texture, uv + distortion * 0.94).r;
        float textSample = (textR + textG + textB) / 3.0;

        // Form base espresso variations across dynamic fluid displacement waves
        vec3 coffeeLiquid = mix(baseEspresso, darkRoast, clamp(height * 2.5, 0.0, 1.0));

        // HIGH-CONTRAST CHROMATIC INTERPOLATION CURVES:
        // Ensures thick patches stay solid brilliant white while thin edges smoothly marble down
        vec3 blendedLiquidState;
        if (creamDensity < 0.25) {
          blendedLiquidState = mix(coffeeLiquid, richMacchiato, creamDensity / 0.25);
        } else {
          blendedLiquidState = mix(richMacchiato, artisanCream, clamp((creamDensity - 0.25) / 1.25, 0.0, 1.0));
        }

        // Composite typography layer
        vec3 textToneColor = vec3(0.98, 0.96, 0.93);
        vec3 compositeBase = mix(blendedLiquidState, textToneColor, textSample);

        // Advanced Fresnel specular highlighting maps
        vec3 lightDir = normalize(vec3(0.2, 0.5, 0.8));
        vec3 viewDir  = vec3(0.0, 0.0, 1.0);
        vec3 halfDir  = normalize(lightDir + viewDir);
        float specularIntensity = pow(max(dot(normal, halfDir), 0.0), 75.0);
        
        // Increase reflective gloss metrics directly over cream profiles for silky look
        float specificGloss = mix(0.5, 1.4, smoothstep(0.1, 0.8, creamDensity));
        vec3 specularColor = vec3(0.99, 0.96, 0.90) * specularIntensity * specificGloss;

        gl_FragColor = vec4(compositeBase + specularColor, 1.0);
      }
    `;

    class FluidSimulationEngine {
      constructor() {
        this.canvas = document.getElementById('webgl-canvas');
        this.fpsDisplay = document.getElementById('fps-display');
        
        this.mouse = { x: 0.5, y: 0.5, prevX: 0.5, prevY: 0.5, targetX: 0.5, targetY: 0.5 };
        
        this.momentum = { x: 0, y: 0 };
        this.dragDirection = { x: 0, y: 0 };
        this.simulatedMouse = { x: 0.5, y: 0.5 };
        this.simulatedMouseOld = { x: 0.5, y: 0.5 }; 
        
        this.pointerForce = 0.0;
        this.hasMoved = false;

        this.splashQueue = [];
        
        this.lastTime = performance.now();
        this.frameCount = 0;

        this.createTextTexture();
        this.initEngine();
        this.triggerInitialPour();
      }

      createTextTexture() {
        this.textCanvas = document.createElement('canvas');
        this.textCtx = this.textCanvas.getContext('2d');
        this.updateTextCanvasSize();
      }

      updateTextCanvasSize() {
        const ratio = Math.min(window.devicePixelRatio, 2);
        this.textCanvas.width = window.innerWidth * ratio;
        this.textCanvas.height = window.innerHeight * ratio;

        const ctx = this.textCtx;
        ctx.clearRect(0, 0, this.textCanvas.width, this.textCanvas.height);
        
        const baseSize = window.innerWidth;
        let fontSize = baseSize * 0.09; 
        if (fontSize < 46) fontSize = 46;
        if (fontSize > 165) fontSize = 165;
        fontSize = fontSize * ratio;

        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, this.textCanvas.width, this.textCanvas.height);

        ctx.font = `400 ${fontSize}px 'Playfair Display', serif`;
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.letterSpacing = "-0.02em";
        
        ctx.fillText("Bruin Coffee", this.textCanvas.width / 2, this.textCanvas.height / 2);

        if (this.textTexture) {
          this.textTexture.needsUpdate = true;
        }
      }

      initEngine() {
        this.scene = new THREE.Scene();
        this.camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        
        this.renderer = new THREE.WebGLRenderer({
          canvas: this.canvas,
          antialias: false,
          powerPreference: "high-performance"
        });
        
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        const ratio = Math.min(window.devicePixelRatio, 2);
        this.renderer.setPixelRatio(ratio);

        this.width = Math.floor(window.innerWidth * ratio);
        this.height = Math.floor(window.innerHeight * ratio);

        const gl = this.renderer.getContext();
        let textureType = THREE.FloatType;
        if (!gl.getExtension('OES_texture_float') || !gl.getExtension('OES_texture_float_linear')) {
          textureType = THREE.HalfFloatType;
        }

        const targetOptions = {
          minFilter: THREE.LinearFilter,
          magFilter: THREE.LinearFilter,
          format: THREE.RGBAFormat,
          type: textureType,
          depthBuffer: false,
          stencilBuffer: false,
        };

        this.bufferA = new THREE.WebGLRenderTarget(this.width, this.height, targetOptions);
        this.bufferB = new THREE.WebGLRenderTarget(this.width, this.height, targetOptions);
        this.bufferC = new THREE.WebGLRenderTarget(this.width, this.height, targetOptions);

        this.textTexture = new THREE.CanvasTexture(this.textCanvas);
        this.textTexture.minFilter = THREE.LinearFilter;
        this.textTexture.magFilter = THREE.LinearFilter;

        this.simulationMaterial = new THREE.ShaderMaterial({
          vertexShader: vertexShaderSource,
          fragmentShader: simulationFragmentShaderSource,
          uniforms: {
            u_resolution: { value: new THREE.Vector2(this.width, this.height) },
            u_current_frame: { value: null },
            u_prev_frame: { value: null },
            u_mouse_pos: { value: new THREE.Vector2(0.5, 0.5) },
            u_mouse_pos_old: { value: new THREE.Vector2(0.5, 0.5) }, 
            u_mouse_dir: { value: new THREE.Vector2(0.0, 0.0) }, 
            u_mouse_force: { value: 0.0 },
            u_splash_pos: { value: new THREE.Vector2(0.5, 0.5) },
            u_splash_force: { value: 0.0 }
          }
        });

        this.renderMaterial = new THREE.ShaderMaterial({
          vertexShader: vertexShaderSource,
          fragmentShader: renderFragmentShaderSource,
          uniforms: {
            u_resolution: { value: new THREE.Vector2(this.width, this.height) },
            u_buffer: { value: null },
            u_text_texture: { value: this.textTexture }
          }
        });

        this.geometry = new THREE.PlaneGeometry(2, 2);
        this.mesh = new THREE.Mesh(this.geometry, this.simulationMaterial);
        this.scene.add(this.mesh);

        this.setupEventListeners();
        this.tick();
      }

      triggerInitialPour() {
        // Enqueue elegant starter cream ribbons across the workspace canvas
        setTimeout(() => this.enqueueSplash(0.5, 0.5, 1.2), 100);
        setTimeout(() => this.enqueueSplash(0.38, 0.45, 0.9), 350);
        setTimeout(() => this.enqueueSplash(0.62, 0.55, 0.9), 550);
        setTimeout(() => this.enqueueSplash(0.48, 0.65, 0.7), 800);
      }

      enqueueSplash(x, y, force) {
        this.splashQueue.push({ x, y, force });
      }

      setupEventListeners() {
        const updateCoords = (x, y) => {
          this.mouse.targetX = (x / window.innerWidth) * this.width;
          this.mouse.targetY = (1.0 - (y / window.innerHeight)) * this.height;
          
          if (!this.hasMoved) {
            this.mouse.x = this.mouse.targetX;
            this.mouse.y = this.mouse.targetY;
            this.mouse.prevX = this.mouse.targetX;
            this.mouse.prevY = this.mouse.targetY;
            this.simulatedMouse.x = this.mouse.targetX;
            this.simulatedMouse.y = this.mouse.targetY;
            this.simulatedMouseOld.x = this.mouse.targetX;
            this.simulatedMouseOld.y = this.mouse.targetY;
            this.hasMoved = true;
          }
        };

        this.canvas.addEventListener('mousemove', (e) => updateCoords(e.clientX, e.clientY));
        this.canvas.addEventListener('touchmove', (e) => {
          if (e.touches.length > 0) updateCoords(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true });

        this.canvas.addEventListener('click', (e) => {
          const x = e.clientX / window.innerWidth;
          const y = 1.0 - (e.clientY / window.innerHeight);
          this.enqueueSplash(x, y, 1.2);
        });

        window.addEventListener('resize', () => {
          const r = Math.min(window.devicePixelRatio, 2);
          this.updateTextCanvasSize();
          this.renderer.setSize(window.innerWidth, window.innerHeight);
          this.width = Math.floor(window.innerWidth * r);
          this.height = Math.floor(window.innerHeight * r);

          this.bufferA.setSize(this.width, this.height);
          this.bufferB.setSize(this.width, this.height);
          this.bufferC.setSize(this.width, this.height);

          this.simulationMaterial.uniforms.u_resolution.value.set(this.width, this.height);
          this.renderMaterial.uniforms.u_resolution.value.set(this.width, this.height);
        });
      }

      tick() {
        requestAnimationFrame(() => this.tick());

        this.frameCount++;
        const now = performance.now();
        if (now >= this.lastTime + 1000) {
          this.fpsDisplay.innerText = `${((this.frameCount * 1000) / (now - this.lastTime)).toFixed(1)} FPS // OPERATIONAL`;
          this.frameCount = 0;
          this.lastTime = now;
        }

        this.simulatedMouseOld.x = this.simulatedMouse.x;
        this.simulatedMouseOld.y = this.simulatedMouse.y;

        this.mouse.x += (this.mouse.targetX - this.mouse.x) * 0.22;
        this.mouse.y += (this.mouse.targetY - this.mouse.y) * 0.22;

        const dx = this.mouse.x - this.mouse.prevX;
        const dy = this.mouse.y - this.mouse.prevY;
        const userVelocity = Math.sqrt(dx * dx + dy * dy);
        
        if (userVelocity > 0.1) {
          this.momentum.x = dx;
          this.momentum.y = dy;
          this.dragDirection.x = dx;
          this.dragDirection.y = dy;
          
          this.simulatedMouse.x = this.mouse.x;
          this.simulatedMouse.y = this.mouse.y;
          this.pointerForce = this.hasMoved ? Math.min(userVelocity * 0.18, 2.5) : 0.0;
        } else {
          this.momentum.x *= 0.88;
          this.momentum.y *= 0.88;
          this.dragDirection.x *= 0.92;
          this.dragDirection.y *= 0.92;
          
          this.simulatedMouse.x += this.momentum.x;
          this.simulatedMouse.y += this.momentum.y;
          
          const lingeringVelocity = Math.sqrt(this.momentum.x * this.momentum.x + this.momentum.y * this.momentum.y);
          this.pointerForce = lingeringVelocity > 0.05 ? Math.min(lingeringVelocity * 0.18, 2.5) : 0.0;
        }

        // Pull active splash out of queue if one exists
        let activeSplash = { x: 0.5, y: 0.5, force: 0.0 };
        if (this.splashQueue.length > 0) {
          activeSplash = this.splashQueue.shift();
        }

        this.mesh.material = this.simulationMaterial;
        const subSteps = 3;
        
        for (let i = 0; i < subSteps; i++) {
          this.simulationMaterial.uniforms.u_mouse_force.value = (i === 0) ? this.pointerForce : 0.0;
          this.simulationMaterial.uniforms.u_mouse_pos.value.set(this.simulatedMouse.x / this.width, this.simulatedMouse.y / this.height);
          this.simulationMaterial.uniforms.u_mouse_pos_old.value.set(this.simulatedMouseOld.x / this.width, this.simulatedMouseOld.y / this.height);
          this.simulationMaterial.uniforms.u_mouse_dir.value.set(this.dragDirection.x, this.dragDirection.y);
          
          this.simulationMaterial.uniforms.u_splash_pos.value.set(activeSplash.x, activeSplash.y);
          this.simulationMaterial.uniforms.u_splash_force.value = (i === 0) ? activeSplash.force : 0.0;
          
          this.simulationMaterial.uniforms.u_current_frame.value = this.bufferA.texture;
          this.simulationMaterial.uniforms.u_prev_frame.value = this.bufferB.texture;

          this.renderer.setRenderTarget(this.bufferC);
          this.renderer.render(this.scene, this.camera);

          const temp = this.bufferB;
          this.bufferB = this.bufferA;
          this.bufferA = this.bufferC;
          this.bufferC = temp;
        }

        this.mesh.material = this.renderMaterial;
        this.renderMaterial.uniforms.u_buffer.value = this.bufferA.texture;

        this.renderer.setRenderTarget(null);
        this.renderer.render(this.scene, this.camera);

        this.mouse.prevX = this.mouse.x;
        this.mouse.prevY = this.mouse.y;
      }
    }

    window.addEventListener('load', () => {
      setTimeout(() => {
        new FluidSimulationEngine();
      }, 250);
    });
  </script>
</body>
</html>
